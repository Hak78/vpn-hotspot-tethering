name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Buildozer dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev tk-dev libgdbm-compat-dev libreoffice-dev
        pip install --upgrade pip
        pip install buildozer cython git+https://github.com

    - name: Build with Buildozer
      run: |
        yes | buildozer -v android debug
      env:
        ACCEPT_SDK_LICENSE: 1

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: vpn-hotspot-apk
        path: bin/*.apk
